name: Build and Publish ARM64 Docker Image (RK3568)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string
  push:
    branches:
      - develop
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COMPILER_IMAGE: ghcr.io/stashapp/compiler:14

jobs:
  # Generate code and build UI
  generate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      githash: ${{ steps.version.outputs.githash }}
      build_date: ${{ steps.version.outputs.build_date }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version info
        id: version
        run: |
          VERSION=""
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="0.$(date +%Y%m%d%H%M%S)-${{ github.sha }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "githash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          package_json_file: ui/v2.5/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install UI dependencies
        run: make pre-ui

      - name: Generate
        run: make generate

      - name: Build UI
        env:
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
          GITHASH: ${{ steps.version.outputs.githash }}
          STASH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          export BUILD_DATE
          export GITHASH
          export STASH_VERSION
          make ui

      - name: Create dist directory
        run: mkdir -p dist

      - name: Upload all build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          retention-days: 1
          path: |
            internal/api/generated_exec.go
            internal/api/generated_models.go
            ui/v2.5/build/
            ui/login/locales/

  # Build ARM64 binary
  build-arm64:
    needs: generate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download generated artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Create dist directory
        run: mkdir -p dist

      - name: Pull compiler image
        run: docker pull ${{ env.COMPILER_IMAGE }}

      - name: Build ARM64 binary
        run: |
          docker run --rm \
            --mount type=bind,source="$(pwd)",target=/stash,consistency=delegated \
            -w /stash \
            ${{ env.COMPILER_IMAGE }} \
            make build-cc-linux-arm64v8

      - name: Verify binary exists
        run: ls -la dist/stash-linux-arm64v8

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v7
        with:
          name: stash-binary
          path: dist/stash-linux-arm64v8
          retention-days: 1

  # Build and publish Docker image
  docker:
    needs: [generate, build-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download generated artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Download ARM64 binary
        uses: actions/download-artifact@v8
        with:
          name: stash-binary
          path: .

      - name: Create dist directory and move binary
        run: |
          mkdir -p dist
          mv stash-linux-arm64v8 dist/

      - name: Verify files exist
        run: |
          echo "=== Checking files ==="
          ls -la dist/stash-linux-arm64v8
          ls -la ui/v2.5/build/
          echo "=== File check complete ==="

      - name: Prepare docker build (remove conflicting .dockerignore entries)
        run: |
          # Backup original .dockerignore
          cp .dockerignore .dockerignore.bak
          # Remove dist and ui/v2.5/build from .dockerignore for ARM64 build
          sed -i '/^dist$/d' .dockerignore
          sed -i '/^ui\/v2.5\/build$/d' .dockerignore
          echo "Modified .dockerignore:"
          cat .dockerignore

      - name: Get version info
        id: version
        run: |
          VERSION=""
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="0.$(date +%Y%m%d%H%M%S)-${{ github.sha }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "githash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.arm64
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64
          build-args: |
            GITHASH=${{ steps.version.outputs.githash }}
            STASH_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Push versioned tags
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64

      - name: Output image info
        run: |
          echo "## Docker Image Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** linux/arm64 (RK3568)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
